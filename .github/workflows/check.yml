name: Check Nintendo Museum tickets

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "ntfy 테스트 알림 보내기"
        type: boolean
        default: false

# 한 번에 하나만 실행. 새 실행은 이전 실행이 끝날 때까지 대기(취소하지 않음)
concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          LOOP_MINUTES: "330"
          INTERVAL_MINUTES: "5"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          retention-days: 3
